<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.98" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="36" fill="url(#bg-kids)" />

  <!-- Decorative Rings -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="200" cy="180" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Center Floating Card -->
  <rect x="50" y="55" width="300" height="290" rx="24" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Category Badge Pill -->
  <rect x="130" y="76" width="140" height="26" rx="13" fill="#f43f5e" />
  <text x="200" y="93" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">KIDS</text>

  <!-- Main Icon Circle -->
  <circle cx="200" cy="165" r="46" fill="#f43f5e" fill-opacity="0.12" />
  <g transform="translate(176, 141) scale(2)" color="#be123c">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="currentColor" stroke-width="2" fill="none"/><line x1="9" y1="9" x2="9.01" y2="9" stroke="currentColor" stroke-width="3"/><line x1="15" y1="9" x2="15.01" y2="9" stroke="currentColor" stroke-width="3"/>
  </g>

  <!-- Brand Typography -->
  <text x="200" y="248" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Kids & Toys</text>
  <text x="200" y="272" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Plush Bears, Dolls & Games</text>

  <!-- Brand Footer -->
  <line x1="80" y1="300" x2="320" y2="300" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="200" y="324" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">CUSTOM GIFT HUB • BHARUCH</text>
</svg>