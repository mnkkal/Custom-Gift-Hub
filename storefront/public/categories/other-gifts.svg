<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-other-gifts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.98" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="36" fill="url(#bg-other-gifts)" />

  <!-- Decorative Rings -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="200" cy="180" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Center Floating Card -->
  <rect x="50" y="55" width="300" height="290" rx="24" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Category Badge Pill -->
  <rect x="130" y="76" width="140" height="26" rx="13" fill="#14b8a6" />
  <text x="200" y="93" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">GIFTS</text>

  <!-- Main Icon Circle -->
  <circle cx="200" cy="165" r="46" fill="#14b8a6" fill-opacity="0.12" />
  <g transform="translate(176, 141) scale(2)" color="#0f766e">
    <polyline points="20 12 20 22 4 22 4 12" stroke="currentColor" stroke-width="2" fill="none"/><rect x="2" y="7" width="20" height="5" stroke="currentColor" stroke-width="2" fill="none"/><line x1="12" y1="22" x2="12" y2="7" stroke="currentColor" stroke-width="2"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" fill="none" stroke="currentColor" stroke-width="2"/>
  </g>

  <!-- Brand Typography -->
  <text x="200" y="248" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Gifts & Novelties</text>
  <text x="200" y="272" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Wind Chimes & Keepsakes</text>

  <!-- Brand Footer -->
  <line x1="80" y1="300" x2="320" y2="300" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="200" y="324" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">CUSTOM GIFT HUB • BHARUCH</text>
</svg>